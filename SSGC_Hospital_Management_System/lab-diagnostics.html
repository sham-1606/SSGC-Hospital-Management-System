<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lab &amp; Diagnostics — SSGC Hospital</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.383.0/lucide.min.js" defer></script>
<script src="firebase-config.js"></script>
<style>
  :root{ --ink:#0B2A43; --primary:#0F4C81; --teal:#2BB3A3; --bg:#FFFFFF; --bg-soft:#F8FAFC; --accent:#2563EB; --line:#E2E8F0; --emergency:#DC2626; --amber:#D97706; --violet:#7C3AED; }
  body{font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg-soft);}
  .font-display{font-family:'Fraunces',serif; font-optical-sizing:auto;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .btn-primary{background:var(--primary); color:white; transition:all .2s ease;}
  .btn-primary:hover{background:#0c3d68; transform:translateY(-1px);}
  .btn-outline{border:1.5px solid var(--primary); color:var(--primary); transition:all .25s ease; background:white;}
  .btn-outline:hover{background:var(--primary); color:white;}
  .btn-teal{background:var(--teal); color:white; transition:all .25s ease;}
  .btn-teal:hover{background:#239484;}
  .btn-ghost{color:var(--ink); transition:all .2s ease;}
  .btn-ghost:hover{background:var(--bg-soft);}
  .chip{border:1px solid var(--line); background:white; font-size:11px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(43,179,163,0.15);}
  .modal-backdrop{background:rgba(11,42,67,0.55); backdrop-filter:blur(2px);}
  .modal-panel{animation:pop .25s ease;}
  @keyframes pop{from{opacity:0; transform:translateY(12px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  .toast{animation:toastIn .3s ease, toastOut .3s ease 2.7s forwards;}
  @keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes toastOut{to{opacity:0; transform:translateY(10px);}}
  .status-dot{width:7px;height:7px;border-radius:999px;display:inline-block;}
  .step{display:flex; align-items:center; gap:6px; font-size:11px; color:#94A3B8;}
  .step .dot{width:18px; height:18px; border-radius:999px; border:2px solid #E2E8F0; display:flex; align-items:center; justify-content:center; background:white;}
  .step.done .dot{background:var(--teal); border-color:var(--teal);}
  .step.done{color:var(--ink); font-weight:600;}
  .step-line{flex:1; height:2px; background:#E2E8F0;}
  .step-line.done{background:var(--teal);}
</style>
</head>
<body class="antialiased">
<div id="rbacBar" style="background:#0F4C81;color:white;font-family:Inter,sans-serif;font-size:12px;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:999;">
  <span id="rbacInfo" style="display:flex;align-items:center;gap:8px;font-weight:600;"></span>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="dashboard.html" style="color:rgba(255,255,255,.75);text-decoration:none;font-size:11px;">&#8592; My Portal</a>
    <a id="rbacSignOut" href="login.html" style="color:rgba(255,255,255,.85);text-decoration:none;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:999px;font-size:11px;">Sign out</a>
  </div>
</div>
<script>
(function(){
  var s=window._sess||JSON.parse(localStorage.getItem('ssgc_session_v1')||'null');
  var EMOJIS={Admin:'👩‍💼',Doctor:'👨‍⚕️',Nurse:'👩‍⚕️',Receptionist:'📞',Pharmacist:'💊',Patient:'🤒'};
  if(s){
    var el=document.getElementById('rbacInfo');
    if(el) el.innerHTML=(EMOJIS[s.role]||'👤')+' '+s.name+' &nbsp;<span style="opacity:.6;font-weight:400;">'+s.role+'</span>';
    var so=document.getElementById('rbacSignOut');
    if(so) so.addEventListener('click',function(){localStorage.removeItem('ssgc_session_v1');});
  }
})();
</script>

<header id="navbar" class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b" style="border-color:var(--line)">
  <div class="max-w-7xl mx-auto px-5 md:px-8 py-3.5 flex items-center justify-between gap-4 flex-wrap">
    <a href="home.html" class="flex items-center gap-2.5">
      <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" stroke="#0F4C81" stroke-width="2"/>
        <path d="M6 20h6l3-8 5 16 3-11 2 3h9" stroke="#2BB3A3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="leading-none">
        <p class="font-display font-semibold text-base">SSGC Hospital</p>
        <p class="font-mono text-[10px] tracking-widest uppercase" style="color:var(--teal)">Lab &amp; Diagnostics</p>
      </div>
    </a>
    <div class="flex items-center gap-2 md:gap-3">
      <a href="dashboard.html" class="btn-ghost hidden md:flex items-center gap-1.5 text-sm font-medium px-3 py-2.5 rounded-full"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</a>
      <a href="ehr.html" class="btn-ghost hidden md:flex items-center gap-1.5 text-sm font-medium px-3 py-2.5 rounded-full"><i data-lucide="file-heart" class="w-4 h-4"></i> EHR</a>
      <button id="openBookBtn" class="btn-primary text-sm font-semibold px-4 py-2.5 rounded-full flex items-center gap-2"><i data-lucide="flask-conical" class="w-4 h-4"></i> Book Test</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-5 md:px-8 py-8">

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
    <div class="bg-white rounded-2xl border p-5" style="border-color:var(--line)">
      <p class="text-xs text-slate-500 mb-1">Booked Today</p>
      <p class="font-mono text-2xl font-semibold" id="statBooked" style="color:var(--primary)">0</p>
    </div>
    <div class="bg-white rounded-2xl border p-5" style="border-color:var(--line)">
      <p class="text-xs text-slate-500 mb-1">Sample Collected</p>
      <p class="font-mono text-2xl font-semibold" id="statCollected" style="color:var(--violet)">0</p>
    </div>
    <div class="bg-white rounded-2xl border p-5" style="border-color:var(--line)">
      <p class="text-xs text-slate-500 mb-1">Awaiting Report</p>
      <p class="font-mono text-2xl font-semibold" id="statAwaiting" style="color:var(--amber)">0</p>
    </div>
    <div class="bg-white rounded-2xl border p-5" style="border-color:var(--line)">
      <p class="text-xs text-slate-500 mb-1">Completed</p>
      <p class="font-mono text-2xl font-semibold" id="statCompleted" style="color:var(--teal)">0</p>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div class="relative flex-1 min-w-[220px]">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input id="searchInput" placeholder="Search by patient or test name..." class="w-full pl-10 pr-4 py-2.5 rounded-full border text-sm" style="border-color:var(--line)"/>
    </div>
    <select id="statusFilter" class="px-3 py-2.5 rounded-full border text-sm" style="border-color:var(--line)">
      <option value="">All Statuses</option>
      <option value="Booked">Booked</option>
      <option value="Sample Collected">Sample Collected</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
    </select>
  </div>

  <div id="testList" class="grid md:grid-cols-2 gap-4"></div>
</main>

<!-- BOOK TEST MODAL -->
<div id="bookModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop">
  <div class="modal-panel bg-white rounded-2xl w-full max-w-md p-6">
    <div class="flex items-center justify-between mb-4">
      <p class="font-display text-lg font-semibold">Book Lab Test</p>
      <button class="bookModalClose btn-ghost p-2 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="bookForm" class="space-y-3">
      <div><label class="text-xs font-medium text-slate-600">Patient</label>
        <select id="tPatient" required class="w-full mt-1 px-3 py-2.5 rounded-xl border text-sm" style="border-color:var(--line)"></select></div>
      <div><label class="text-xs font-medium text-slate-600">Test</label>
        <select id="tTest" required class="w-full mt-1 px-3 py-2.5 rounded-xl border text-sm" style="border-color:var(--line)">
          <option>Complete Blood Count (CBC)</option><option>Lipid Profile</option><option>Liver Function Test</option>
          <option>Kidney Function Test</option><option>Blood Sugar (Fasting)</option><option>Chest X-Ray</option>
          <option>MRI — Brain</option><option>ECG</option><option>Urinalysis</option><option>COVID-19 PCR</option>
        </select></div>
      <div><label class="text-xs font-medium text-slate-600">Referring Doctor</label>
        <select id="tDoctor" class="w-full mt-1 px-3 py-2.5 rounded-xl border text-sm" style="border-color:var(--line)"></select></div>
      <div><label class="text-xs font-medium text-slate-600">Preferred Date</label>
        <input id="tDate" type="date" required class="w-full mt-1 px-3 py-2.5 rounded-xl border text-sm" style="border-color:var(--line)"/></div>
      <button class="btn-primary w-full rounded-xl py-2.5 font-semibold text-sm mt-2">Book Test</button>
    </form>
  </div>
</div>

<!-- RESULT MODAL -->
<div id="resultModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop">
  <div class="modal-panel bg-white rounded-2xl w-full max-w-md p-6">
    <div class="flex items-center justify-between mb-4">
      <p class="font-display text-lg font-semibold">Upload Result</p>
      <button class="resultModalClose btn-ghost p-2 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="resultForm" class="space-y-3">
      <input type="hidden" id="resultTestId"/>
      <div><label class="text-xs font-medium text-slate-600">Report File</label>
        <input id="resultFile" type="file" accept="application/pdf,image/*" class="w-full mt-1 text-sm"/>
        <p class="text-xs text-slate-400 mt-1">PDF or image — stored as a reference for this demo.</p></div>
      <div><label class="text-xs font-medium text-slate-600">Result Summary</label>
        <textarea id="resultSummary" rows="3" required placeholder="e.g. All values within normal range." class="w-full mt-1 px-3 py-2.5 rounded-xl border text-sm resize-none" style="border-color:var(--line)"></textarea></div>
      <div><label class="text-xs font-medium text-slate-600">Flag</label>
        <select id="resultFlag" class="w-full mt-1 px-3 py-2.5 rounded-xl border text-sm" style="border-color:var(--line)">
          <option value="Normal">Normal</option><option value="Attention">Needs Attention</option><option value="Critical">Critical</option>
        </select></div>
      <button class="btn-primary w-full rounded-xl py-2.5 font-semibold text-sm mt-2">Save &amp; Mark Completed</button>
    </form>
  </div>
</div>

<div id="toastRoot" class="fixed bottom-5 right-5 z-[70] flex flex-col gap-2"></div>

<script>
/* == ROLE GUARD == */
(function(){
  var s=JSON.parse(localStorage.getItem('ssgc_session_v1')||'null');
  var ok=['Admin','Doctor','Nurse','Patient'];
  if(!s){window.location.href='login.html';return;}
  if(!ok.includes(s.role)){alert('Access restricted for '+s.role+' role.');window.location.href='dashboard.html';return;}
  window._sess=s;
})();
/* ================ */

document.addEventListener('DOMContentLoaded', () => window.lucide && lucide.createIcons());

const PATIENTS_KEY = 'ssgc_patients_v1';
const DOCTORS_KEY = 'ssgc_doctors_v1';
const TESTS_KEY = 'ssgc_labtests_v1';
let patients = [], doctors = [], tests = [];
const STAGES = ['Booked','Sample Collected','In Progress','Completed'];

function pad2(n){ return n.toString().padStart(2,'0'); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, icon='check-circle'){
  const el = document.createElement('div');
  el.className = 'toast bg-white border rounded-xl shadow-lg px-4 py-3 flex items-center gap-2 text-sm';
  el.style.borderColor = 'var(--line)';
  el.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4" style="color:var(--teal)"></i>${escapeHtml(msg)}`;
  document.getElementById('toastRoot').appendChild(el);
  lucide.createIcons();
  setTimeout(()=>el.remove(), 3000);
}

function loadRefs(){
  patients = JSON.parse(localStorage.getItem(PATIENTS_KEY) || '[]');
  if (!patients.length){ patients = [{id:'SSGC-2026-00001',name:'Ayesha Raza'},{id:'SSGC-2026-00002',name:'Hassan Iqbal'}]; localStorage.setItem(PATIENTS_KEY, JSON.stringify(patients)); }
  doctors = JSON.parse(localStorage.getItem(DOCTORS_KEY) || '[]');
  if (!doctors.length){ doctors = [{id:'DOC-001',name:'Dr. Amina Farooq'},{id:'DOC-002',name:'Dr. Bilal Sheikh'}]; }
}
function seedTests(){
  return [
    { id:'LAB-001', patient:'Ayesha Raza', test:'Lipid Profile', doctor:'Dr. Amina Farooq', date:'2026-08-14', status:'Completed', summary:'LDL slightly elevated; recommend dietary follow-up.', flag:'Attention', file:'lipid_profile_ayesha.pdf' },
    { id:'LAB-002', patient:'Hassan Iqbal', test:'Complete Blood Count (CBC)', doctor:'Dr. Bilal Sheikh', date:'2026-08-15', status:'In Progress', summary:'', flag:'', file:'' },
    { id:'LAB-003', patient:'Ayesha Raza', test:'Chest X-Ray', doctor:'Dr. Amina Farooq', date:'2026-08-16', status:'Sample Collected', summary:'', flag:'', file:'' },
    { id:'LAB-004', patient:'Hassan Iqbal', test:'Blood Sugar (Fasting)', doctor:'Dr. Bilal Sheikh', date:'2026-08-16', status:'Booked', summary:'', flag:'', file:'' }
  ];
}
function load(){
  loadRefs();
  tests = JSON.parse(localStorage.getItem(TESTS_KEY) || 'null') || seedTests();
  localStorage.setItem(TESTS_KEY, JSON.stringify(tests));
}
function persist(){ localStorage.setItem(TESTS_KEY, JSON.stringify(tests)); }

function renderStats(){
  const today = todayStr();
  document.getElementById('statBooked').textContent = tests.filter(t=>t.date===today).length;
  document.getElementById('statCollected').textContent = tests.filter(t=>t.status==='Sample Collected').length;
  document.getElementById('statAwaiting').textContent = tests.filter(t=>t.status==='In Progress').length;
  document.getElementById('statCompleted').textContent = tests.filter(t=>t.status==='Completed').length;
}

function stageIndex(status){ return STAGES.indexOf(status); }

function renderList(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const filtered = tests.filter(t =>
    (!q || t.patient.toLowerCase().includes(q) || t.test.toLowerCase().includes(q)) &&
    (!status || t.status === status)
  ).sort((a,b)=> b.date.localeCompare(a.date));

  const wrap = document.getElementById('testList');
  wrap.innerHTML = filtered.map(t => {
    const idx = stageIndex(t.status);
    const flagColor = t.flag==='Critical' ? '#DC2626' : t.flag==='Attention' ? '#D97706' : '#2BB3A3';
    return `
    <div class="bg-white rounded-2xl border p-5" style="border-color:var(--line)">
      <div class="flex items-start justify-between mb-3">
        <div>
          <p class="font-semibold text-sm">${escapeHtml(t.test)}</p>
          <p class="text-xs text-slate-500">${escapeHtml(t.patient)} · Ref: ${escapeHtml(t.doctor)} · ${t.date}</p>
        </div>
        <span class="font-mono text-[10px] text-slate-400">${t.id}</span>
      </div>
      <div class="flex items-center gap-1 mb-4">
        ${STAGES.map((s,i)=>`
          <div class="step ${i<=idx?'done':''}"><span class="dot">${i<=idx?'<i data-lucide=\"check\" class=\"w-2.5 h-2.5 text-white\"></i>':''}</span></div>
          ${i<STAGES.length-1?`<div class="step-line ${i<idx?'done':''}"></div>`:''}
        `).join('')}
      </div>
      <p class="text-xs text-slate-400 mb-3">${t.status}</p>
      ${t.status==='Completed' ? `
        <div class="chip rounded-xl p-3 text-xs">
          <p class="flex items-center gap-1.5 font-medium mb-1"><span class="status-dot" style="background:${flagColor}"></span>${t.flag}${t.file?` · <i data-lucide=\"paperclip\" class=\"w-3 h-3 inline\"></i> ${escapeHtml(t.file)}`:''}</p>
          <p class="text-slate-600">${escapeHtml(t.summary)}</p>
        </div>` :
        `<div class="flex gap-2">
          ${idx < STAGES.length-2 ? `<button class="advanceBtn btn-outline text-xs font-semibold px-3 py-2 rounded-full" data-id="${t.id}">Advance to ${STAGES[idx+1]}</button>` : ''}
          ${t.status==='In Progress' ? `<button class="uploadBtn btn-teal text-xs font-semibold px-3 py-2 rounded-full" data-id="${t.id}">Upload Result</button>` : ''}
        </div>`}
    </div>`;
  }).join('') || '<p class="text-sm text-slate-400 col-span-2 text-center py-10">No tests match your filters.</p>';
  lucide.createIcons();
  wrap.querySelectorAll('.advanceBtn').forEach(b => b.addEventListener('click', () => {
    const t = tests.find(x=>x.id===b.dataset.id);
    t.status = STAGES[stageIndex(t.status)+1];
    persist(); renderAll(); toast(t.test + ' → ' + t.status);
  }));
  wrap.querySelectorAll('.uploadBtn').forEach(b => b.addEventListener('click', () => openResultModal(b.dataset.id)));
}

function renderAll(){ renderStats(); renderList(); }

document.getElementById('searchInput').addEventListener('input', renderList);
document.getElementById('statusFilter').addEventListener('change', renderList);

const bookModal = document.getElementById('bookModal');
document.getElementById('openBookBtn').addEventListener('click', () => {
  document.getElementById('bookForm').reset();
  document.getElementById('tPatient').innerHTML = patients.map(p=>`<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join('');
  document.getElementById('tDoctor').innerHTML = doctors.map(d=>`<option value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
  document.getElementById('tDate').value = todayStr();
  bookModal.classList.remove('hidden'); bookModal.classList.add('flex');
});
document.querySelectorAll('.bookModalClose').forEach(b => b.addEventListener('click', () => { bookModal.classList.add('hidden'); bookModal.classList.remove('flex'); }));
document.getElementById('bookForm').addEventListener('submit', e => {
  e.preventDefault();
  tests.push({
    id: 'LAB-' + String(tests.length+1).padStart(3,'0'),
    patient: document.getElementById('tPatient').value,
    test: document.getElementById('tTest').value,
    doctor: document.getElementById('tDoctor').value,
    date: document.getElementById('tDate').value,
    status: 'Booked', summary:'', flag:'', file:''
  });
  persist(); renderAll();
  bookModal.classList.add('hidden'); bookModal.classList.remove('flex');
  toast('Test booked successfully');
});

const resultModal = document.getElementById('resultModal');
function openResultModal(id){
  document.getElementById('resultForm').reset();
  document.getElementById('resultTestId').value = id;
  resultModal.classList.remove('hidden'); resultModal.classList.add('flex');
}
document.querySelectorAll('.resultModalClose').forEach(b => b.addEventListener('click', () => { resultModal.classList.add('hidden'); resultModal.classList.remove('flex'); }));
document.getElementById('resultForm').addEventListener('submit', e => {
  e.preventDefault();
  const t = tests.find(x => x.id === document.getElementById('resultTestId').value);
  const file = document.getElementById('resultFile').files[0];
  t.file = file ? file.name : '';
  t.summary = document.getElementById('resultSummary').value;
  t.flag = document.getElementById('resultFlag').value;
  t.status = 'Completed';
  persist(); renderAll();
  resultModal.classList.add('hidden'); resultModal.classList.remove('flex');
  toast('Result saved — patient notified');
});

load();
renderAll();
</script>
</body>
</html>
